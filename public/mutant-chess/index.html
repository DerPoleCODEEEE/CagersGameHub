<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Mutant Merge | Cager Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="splash-screen" class="scribble-box">
        <h2>Verbinde zum Labor...</h2>
    </div>

    <div id="game-container" style="display: none;">
        <header class="scribble-box">
            <h1>Mutant Merge Chess</h1>
            <div id="player-info">
                <img id="twitch-avatar" src="" alt="Avatar">
                <span id="twitch-name">Lade...</span>
            </div>
            <div class="turn-indicator" id="turn-indicator">Warte auf Gegner...</div>
        </header>

        <main>
            <div id="chessboard" class="scribble-box">
                <!-- Generiert via client.js -->
            </div>
        </main>

        <div class="controls">
            <a href="/" id="btn-leave" class="scribble-btn">Flucht ins Hub</a>
        </div>
    </div>

    <div id="game-over-modal" class="scribble-box" style="display:none; position:absolute; z-index: 100; text-align: center; padding: 40px; background: var(--accent-yellow);">
        <h1 id="win-text">Spiel Vorbei!</h1>
        <a href="/" class="scribble-btn">Zurück zum Hub</a>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="client.js"></script>
</body>
</html>
