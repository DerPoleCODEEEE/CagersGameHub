<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaos Chess | Cager Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

    <!-- ROUNDS-STYLE OVERLAY (JETZT DIREKT AUF SCREEN-EBENE ZENTRIERT) -->
    <div id="card-selection-overlay" class="modal-overlay hidden" style="display: none;">
        <div class="card-selection-box scribble-box">
            <h2>WÄHLE EINE CHAOS-KARTE!</h2>
            <p class="vote-timer-text">Chat/Spieler stimmen ab... <span id="vote-timer">30</span>s</p>
            
            <div id="cards-container" class="cards-container">
                <!-- Karten werden dynamisch erzeugt -->
            </div>
        </div>
    </div>

    <!-- PROMOTION MODAL -->
    <div id="promotion-modal" class="modal-overlay" style="display: none;">
        <div class="promotion-box scribble-box" id="promo-options"></div>
    </div>

    <!-- PRE-LOBBY MENU -->
    <div id="menu-screen" class="card scribble-box">
        <h1>Chaos Chess</h1>
        <p class="subtitle">Turn-based with crazy event cards!</p>
        
        <div class="input-group">
            <label style="display:block; text-align:left; font-weight:bold; margin-bottom:5px;">Your Name:</label>
            <input type="text" id="player-name" placeholder="Enter name..." maxlength="15" class="scribble-input">
        </div>

        <div class="input-group" style="margin-top: 15px; text-align: left;">
            <label style="font-weight:bold; display:block;">Karten-Event alle: <span id="interval-val" style="color:#e74c3c;">6</span> Züge</label>
            <input type="range" id="card-interval-range" min="2" max="10" step="2" value="6" style="width:100%; accent-color:#f1c40f; cursor:pointer;">
        </div>

        <div class="button-group" style="margin-top:20px;">
            <button id="btn-create" class="btn btn-primary scribble-btn">Create Room</button>
            <div class="divider">or</div>
            <div class="join-box">
                <input type="text" id="room-code-input" placeholder="CODE" maxlength="6">
                <button id="btn-join" class="btn btn-secondary scribble-btn">Join Room</button>
            </div>
            <div class="divider"></div>
            <a href="/" class="btn scribble-btn btn-back-center" style="background:#ddd; text-decoration:none; display:block; text-align:center; color:#000;">Back to Hub</a>
        </div>
        <div id="error-msg" class="error-msg" style="color:red; margin-top:10px;"></div>
    </div>

    <div id="lobby-screen" class="card scribble-box hidden">
        <h2>Waiting for Opponent</h2>
        <div class="code-display" id="display-room-code">------</div>
    </div>

    <!-- MAIN GAME SCREEN -->
    <div id="game-screen" class="hidden">
        <div class="layout">
            <div id="game-container">
                <div class="player-bar top">
                    <span id="top-player-name">Opponent</span>
                </div>

                <div class="chaos-progress-container scribble-box">
                    <span class="progress-label">NÄCHSTE CHAOS-KARTE:</span>
                    <div class="progress-bar-bg">
                        <div id="chaos-progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>

                <div id="board-wrapper">
                    <div id="board"></div>
                </div>

                <div class="player-bar bottom">
                    <span id="bottom-player-name">You</span>
                </div>
            </div>

            <div class="sidebar scribble-box">
                <h2>Chaos Chess</h2>
                <div class="mode-badge-box">
                    <span class="sidebar-title">TURN:</span>
                    <span id="turn-display-tag" class="mode-tag">WHITE</span>
                </div>
                
                <button id="btn-ready" class="btn btn-ready scribble-btn">I AM READY!</button>

                <div id="active-card-box" class="scribble-box" style="padding:15px; margin-top:15px; background: #fff3cd; display:none;">
                    <span style="font-size: 12px; font-weight: bold; color: #888;">AKTIVER EFFEKT:</span>
                    <h3 style="margin:2px 0 0 0; color:#e67e22;" id="card-name">Kein Effekt</h3>
                    <p style="margin:5px 0; font-size:16px;" id="card-desc">Spielt normales Schach!</p>
                    <small style="color:#e74c3c; font-weight:bold;" id="card-turns">Verbleibende Züge: 0</small>
                </div>
            </div>
        </div>
    </div>
    <script src="client.js"></script>
</body>
</html>
