<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Hub | Play Bots</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
</head>
<body>

    <img src="https://www.pngmart.com/files/23/Flork-PNG-Transparent.png" class="flork-bg flork-left" alt="Flork">
    <img src="https://preview.redd.it/i-decided-to-hdify-some-beloved-florks-and-some-props-out-v0-mcngsmlz6jta1.png?width=256&format=png&auto=webp&s=ec5657c67496580498f1dbd27923602123976fa2" class="flork-bg flork-right" alt="Flork HD">

    <div class="layout">
        <!-- Game Board Section -->
        <div id="game-container">
            <div class="player-bar top">
                <div class="player-info">
                    <!-- IDs hinzugefügt für dynamischen Wechsel -->
                    <img class="chess-avatar" id="bot-avatar" src="https://ui-avatars.com/api/?name=The+Cager&background=9b59b6&color=fff&bold=true" alt="Bot Avatar">
                    <span id="bot-name">TheCager (BOT)</span>
                    <span class="bot-elo-tag" id="bot-elo">2132 ELO</span>
                </div>
                <!-- BOT CLOCK -->
                <div class="clock-box" id="bot-clock">03:00</div>
            </div>

            <div id="board-wrapper">
                <div id="board"></div>
            </div>

            <div class="player-bar bottom">
                <div class="player-info">
                    <img id="my-pfp" class="chess-avatar hidden" src="">
                    <span id="my-name">You</span>
                </div>
                <!-- PLAYER CLOCK -->
                <div class="clock-box" id="player-clock">03:00</div>
            </div>
        </div>

        <!-- Sidebar Panel -->
        <div class="sidebar scribble-box">
            <div class="logo-area">
                <h2 style="margin:0; font-size: 24px;" id="sidebar-title">Play Bots!</h2>
                <span class="tag">VS AI</span>
            </div>

            <!-- 🆕 NEU: BOT AUSWAHL -->
            <div class="stats-section scribble-box">
                <div class="sidebar-title">🤖 Choose Opponent</div>
                <label>
                    <select id="bot-select" class="scribble-select" onchange="changeBot()">
                        <!-- Die Werte ("cager", "hikaru") entsprechen dem Dateinamen: hikaru-config.json -->
                        <option value="cager">TheCager</option>
                        <option value="hikaru">Hikaru Nakamura</option>
                        <option value="gotham">GothamChess</option>
                        <option value="magnus">Magnus Carlsen</option>
                        <option value="botez">Andrea Botez</option>
                    </select>
                </label>
            </div>

            <!-- TIME CONTROL SETTINGS -->
            <div class="stats-section scribble-box">
                <div class="sidebar-title">⏱️ Time Control</div>
                <div class="time-control-grid">
                    <label>
                        <span>Mode:</span>
                        <select id="time-select" class="scribble-select" onchange="updateTimeSettings()">
                            <option value="180">3 Min (Blitz)</option>
                            <option value="60">1 Min (Bullet)</option>
                            <option value="300">5 Min (Blitz)</option>
                            <option value="600">10 Min (Rapid)</option>
                            <option value="zen">🧘 Zen Mode (Unlimited)</option>
                        </select>
                    </label>
                    <label id="inc-label">
                        <span>Increment:</span>
                        <select id="inc-select" class="scribble-select" onchange="updateTimeSettings()">
                            <option value="2">+2 Sec</option>
                            <option value="0">+0 Sec</option>
                            <option value="5">+5 Sec</option>
                        </select>
                    </label>
                </div>
            </div>

            <!-- Chat Section -->
            <div class="chat-section scribble-box">
                <div class="chat-header">💬 Live Chat</div>
                <div id="chat-messages" class="chat-messages">
                    <div class="chat-msg bot"><b id="chat-welcome-name">TheCager:</b> Hey! Select your opponent and let's play!</div>
                </div>
            </div>

            <!-- ACTION BUTTONS -->
            <div class="actions-row">
                <button id="btn-restart" class="btn btn-primary scribble-btn">New Game</button>
                <button id="btn-undo" class="btn btn-secondary scribble-btn">Undo Move</button>
            </div>
            <div class="actions-row">
                <button id="btn-resign" class="btn btn-danger scribble-btn">Resign</button>
                <button id="btn-pgn" class="btn btn-secondary scribble-btn">Download PGN</button>
            </div>

            <a href="/" class="btn scribble-btn btn-danger btn-leave">Back to Hub</a>
        </div>
    </div>

    <script src="client.js"></script>
</body>
</html>
