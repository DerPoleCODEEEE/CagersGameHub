<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Cager Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="scribble-box header-box">
        <div class="logo">
            <h1>CAGER GAMES</h1>
        </div>
        <div class="auth-section" id="auth-section">
            <span id="loading-auth">Lädt...</span>
        </div>
    </header>

    <main>
        <h2 class="title-scribble">Wähle dein Spiel</h2>
        <div class="game-grid">
            <div class="game-card scribble-box">
                <div class="game-img" style="background-color: #739552; display:flex; align-items:center; justify-content:center;">
                    <span style="font-size: 50px;">♞</span>
                </div>
                <h3>Cagers Quick Chess</h3>
                <p>Real-Time Action! Keine Runden, nur Cooldowns.</p>
                <a href="/chess" class="play-btn scribble-btn">Spielen</a>
            </div>

            <div class="game-card scribble-box locked">
                <div class="game-img" style="background-color: #ddd; display:flex; align-items:center; justify-content:center;">
                    <span style="font-size: 50px; color:#888;">?</span>
                </div>
                <h3>Flappy Cager</h3>
                <p>Coming Soon...</p>
                <button class="play-btn scribble-btn disabled" disabled>Bald verfügbar</button>
            </div>

            <div class="game-card scribble-box locked">
                <div class="game-img" style="background-color: #ddd; display:flex; align-items:center; justify-content:center;">
                    <span style="font-size: 50px; color:#888;">?</span>
                </div>
                <h3>Cager Tower Defense</h3>
                <p>Coming Soon...</p>
                <button class="play-btn scribble-btn disabled" disabled>Bald verfügbar</button>
            </div>
        </div>
    </main>

    <script>
        fetch('/api/user')
            .then(res => res.json())
            .then(user => {
                const authSection = document.getElementById('auth-section');
                if (user) {
                    authSection.innerHTML = `
                        <div class="profile-info">
                            <img src="${user.profileImageUrl}" alt="Avatar" class="avatar scribble-avatar">
                            <span class="user-name">${user.displayName}</span>
                            <a href="/auth/logout" class="logout-link">Abmelden</a>
                        </div>
                    `;
                    localStorage.setItem('cager_twitch_name', user.displayName);
                } else {
                    authSection.innerHTML = `
                        <a href="/auth/twitch" class="twitch-btn scribble-btn">
                            Mit Twitch einloggen
                        </a>
                    `;
                    localStorage.removeItem('cager_twitch_name');
                }
            });
    </script>
</body>
</html>
